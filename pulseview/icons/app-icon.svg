<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e3a"/>
      <stop offset="1" stop-color="#14161d"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34c759"/>
      <stop offset="1" stop-color="#2fd6c3"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e93a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8e93a3" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- rounded square, macOS shape -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- faint grid of the canvas -->
  <g fill="#aeb3c2" opacity="0.10">
    <circle cx="264" cy="308" r="7"/><circle cx="512" cy="308" r="7"/><circle cx="760" cy="308" r="7"/>
    <circle cx="264" cy="512" r="7"/><circle cx="760" cy="512" r="7"/>
    <circle cx="264" cy="716" r="7"/><circle cx="512" cy="716" r="7"/><circle cx="760" cy="716" r="7"/>
  </g>
  <!-- analog trace behind, faded -->
  <path d="M 175 560 C 240 420, 300 420, 366 560 S 490 700, 556 560 S 680 420, 746 560 S 812 640, 850 585"
        fill="none" stroke="url(#fade)" stroke-width="34" stroke-linecap="round"/>
  <!-- logic trace, bold -->
  <path d="M 175 620 H 340 V 420 H 470 V 620 H 585 V 420 H 700 V 620 H 850"
        fill="none" stroke="url(#wave)" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
